baseurl = "https://jacknesstjh.github.io"
languageCode = "en"
defaultContentLanguage = "en"
title = "Be the change,you wanna see in the world"
theme = "hugo-theme-stack"

# copyright = ""

# googleAnalytics = ""


#[services.disqus]
#shortname = "jackness-me"   # ← 改成你刚才的 Shortname，例如 myblog-123

#disqusShortname = "jackness-me"

# 可选：全局开启评论（很多主题需要）
  


# enableRobotsTXT = true

[params]
  #comments = true
  background = "black"
  # backgroundImage = "/me/background.jpg"
  linkColor = "seagreen"

  [params.comments]
    enabled = true                    # 开启评论
    provider = "disqus"               # 使用 Disqus
    disqus = { shortname = "jackness-me" }   # 替换成你的 Shortname

  [params.Author]
  author = "Jackness Tang"
  email = "tjhchina@gmail.com"

  [params.Avatar]
  avatarURL = "/img/avatar.png"

  

  # description = ""
  motto = "Things change,Roll with it"
  
  
  github = "jacknesstjh"
  # linkedin = ""
  # codepen = ""
  # stackoverflow = ""

  siteStartYear = 2016

  # favicon = "/favicon.ico"

  # dark mode
  darkLinkColor = "darkseagreen"
  darkNav = true 
  dark404Button = true
  contentDir = "content/post"

  ignoreLogs = ['warning-goldmark-raw-html']

  [markup]
  [markup.goldmark.renderer]
    unsafe = true

  [module]
    [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v3"
    



